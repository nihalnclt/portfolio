<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auto Follow</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      /* One centred column with side borders, like a timeline */
      .col { max-width: 600px; min-height: 100vh; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

      .top {
        position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 14px; height: 53px; padding: 0 16px;
        background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      }
      .top img { width: 30px; height: 30px; display: block; }
      .top .title { font-size: 20px; font-weight: 800; line-height: 1.2; }
      .probadge { display: inline-flex; align-items: center; margin-left: 10px; padding: 1px 8px 1px 7px; border: 1px solid #f5c518; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.04em; color: #f5c518; vertical-align: 3px; }
      .probadge[hidden] { display: none; }
      .probadge .crown { width: 13px; height: 13px; margin-right: 4px; fill: #f5c518; }
      .top .sub { font-size: 13px; color: var(--muted); }

      /* Profile header */
      .banner { height: 130px; background: linear-gradient(135deg, #1d9bf0 0%, #0b3a5c 55%, #16181c 100%); }
      .phead { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 16px 0; }
      .avatar {
        width: 112px; height: 112px; margin-top: -68px; border-radius: 50%; border: 4px solid var(--bg);
        background: var(--surface); overflow: hidden; display: grid; place-items: center;
        font-size: 44px; font-weight: 800; color: var(--muted); text-transform: uppercase;
      }
      .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .avatar img:not([src]) { display: none; }
      #toggle { min-width: 104px; }
      .pinfo { padding: 10px 16px 14px; }
      #who { font-size: 20px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
      #handle { color: var(--muted); }
      #what { margin-top: 12px; }
      #counts { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 12px; color: var(--muted); }
      #counts b { color: var(--text); font-weight: 700; }
      #counts:empty { display: none; }

      /* Run stats */
      .stats { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
      .stat { padding: 14px 16px; }
      .stat + .stat { border-left: 1px solid var(--border); }
      .stat .label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
      .stat .big { margin-top: 2px; font-size: 31px; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
      .stat .big small { font-size: 15px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
      .track { height: 4px; margin-top: 10px; border-radius: 999px; background: var(--border); overflow: hidden; }
      #prog { height: 100%; width: 0; border-radius: 999px; background: var(--accent); transition: width 0.3s; }

      /* Activity list, one user cell per row */
      .cell { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); transition: background 0.15s; }
      .cell:hover { background: var(--hover); }
      .cell .pic {
        width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--surface);
        display: grid; place-items: center; font-weight: 700; color: var(--muted); text-transform: uppercase;
      }
      .cell .main { flex: 1; min-width: 0; }
      .cell .name { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      a.name:hover { text-decoration: underline; }
      .cell .time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .pill { flex: none; padding: 5px 14px; border-radius: 999px; border: 1px solid var(--border-strong); font-size: 14px; font-weight: 700; }
      .pill.ok { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
      .pill.bad { border-color: #67070f; color: var(--bad); }
      .pill.skip { border-color: var(--border); color: var(--muted); font-weight: 400; }
      /* System notes (cooldowns, pauses, stops) have no account */
      .cell.note { padding: 9px 16px; font-size: 13px; color: var(--muted); }
      .cell.note.bad { color: var(--bad); }
      .cell.note .time { margin-left: auto; }
      .empty { padding: 40px 32px; text-align: center; color: var(--muted); }
      .empty b { display: block; margin-bottom: 6px; font-size: 20px; font-weight: 800; color: var(--text); }

      .pager { display: flex; justify-content: center; align-items: center; gap: 4px; padding: 14px 16px 40px; }
      .pager .btn { min-height: 32px; padding: 0 12px; border-color: transparent; color: var(--accent); }
      .pager .btn:disabled { color: var(--muted); }
      #page { min-width: 64px; text-align: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div class="col">
      <div class="top">
        <img src="icons/icon128.png" alt="" />
        <div>
          <div class="title">Auto Follow<span id="proBadge" class="probadge" hidden><svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-1.8 10H4.8L3 8zm2 12h14v1.5H5V20z"/></svg>PRO</span></div>
          <div class="sub" id="sub"></div>
        </div>
      </div>

      <div class="banner"></div>
      <div class="phead">
        <div class="avatar"><span id="initial"></span><img id="avatar" alt="" /></div>
        <button class="btn" id="toggle"></button>
      </div>
      <div class="pinfo">
        <div id="who"></div>
        <div id="handle"></div>
        <div id="what"></div>
        <div id="counts"></div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="label">Today</div>
          <div class="big"><span id="count">0</span> <small id="cap"></small></div>
          <div class="track"><div id="prog"></div></div>
        </div>
        <div class="stat" id="runstat">
          <div class="label"><span class="dot"></span><span id="state"></span></div>
          <div class="big" id="timer"></div>
        </div>
      </div>

      <div class="tabs"><button class="on" tabindex="-1">Activity</button></div>
      <div id="rows"></div>
      <div class="empty" id="empty"><b>Nothing yet</b>The first action runs about 30 seconds after start.</div>

      <div class="pager">
        <button class="btn" id="first" aria-label="First page">&laquo;</button>
        <button class="btn" id="prev" aria-label="Previous page">&lsaquo;</button>
        <span id="page"></span>
        <button class="btn" id="next" aria-label="Next page">&rsaquo;</button>
        <button class="btn" id="last" aria-label="Last page">&raquo;</button>
      </div>
    </div>
    <script src="config.js"></script>
    <script src="state.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
